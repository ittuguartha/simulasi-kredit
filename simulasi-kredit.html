<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Simulasi Kredit BPR Tugu Artha Sejahtera</title>

<style>

body{
    margin:0;
    padding:20px;
    background:#f4f4f4;
    font-family:Arial,sans-serif;
}

.simulasi-wrap{
    max-width:500px;
    margin:auto;
    background:#fff;
    padding:25px;
    border-radius:20px;
    box-shadow:0 10px 30px rgba(0,0,0,0.1);
}

.logo{
    text-align:center;
    margin-bottom:15px;
}

.logo img{
    max-width:120px;
}

h2{
    text-align:center;
    color:#b30000;
    margin-bottom:25px;
}

label{
    font-weight:bold;
    display:block;
    margin-bottom:8px;
    color:#333;
}

input,
select{
    width:100%;
    padding:13px;
    border:1px solid #ddd;
    border-radius:12px;
    margin-bottom:18px;
    font-size:15px;
    box-sizing:border-box;
}

.button-group{
    display:flex;
    gap:10px;
}

.button-group button{
    flex:1;
    padding:14px;
    border:none;
    border-radius:12px;
    color:#fff;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
    transition:0.3s;
}

.btn-hitung{
    background:#b30000;
}

.btn-hitung:hover{
    background:#8d0000;
}

.btn-clear{
    background:#888;
}

.btn-clear:hover{
    background:#666;
}

.hasil{
    margin-top:25px;
    background:#f5f5f5;
    padding:20px;
    border-radius:15px;
    display:none;
}

.hasil p{
    margin:10px 0;
    color:#333;
}

.hasil span{
    font-weight:bold;
    color:#b30000;
    font-size:18px;
}

.note{
    margin-top:15px;
    font-size:13px;
    color:#666;
    line-height:1.5;
}

.footer{
    margin-top:25px;
    text-align:center;
    font-size:13px;
    color:#777;
}

@media(max-width:600px){

    body{
        padding:10px;
    }

    .simulasi-wrap{
        padding:20px;
    }

}

</style>
</head>

<body>

<div class="simulasi-wrap">

    <div class="logo">
        <!-- GANTI URL LOGO DI BAWAH -->
        <!-- <img src="logo.png"> -->
    </div>

    <h2>Simulasi Kredit</h2>

    <label>Jenis Kredit</label>

    <select id="jenis">
        <option value="umum">Kredit Umum</option>
        <option value="umkm">Kredit UMKM</option>
        <option value="asn">Kredit ASN</option>
        <option value="pppk">Kredit PPPK</option>
    </select>

    <label>Jumlah Pinjaman</label>

    <input 
        type="text" 
        id="pinjaman"
        placeholder="Contoh : 25.000.000"
    >

    <label>Lama Pinjaman (bulan)</label>

    <input 
        type="number" 
        id="tenor"
        placeholder="Contoh : 24"
    >

    <div class="button-group">

        <button class="btn-hitung" onclick="hitungSimulasi()">
            Hitung Simulasi
        </button>

        <button class="btn-clear" onclick="resetForm()">
            Clear
        </button>

    </div>

    <div class="hasil" id="hasil">

        <p>Bunga per Tahun :</p>
        <span id="bunga"></span>

        <p>Angsuran per Bulan :</p>
        <span id="angsuran"></span>

        <div class="note" id="note"></div>

    </div>

    <div class="footer">
        BPR Tugu Artha Sejahtera
    </div>

</div>

<script>

function rupiah(angka){

    return new Intl.NumberFormat('id-ID',{
        style:'currency',
        currency:'IDR',
        minimumFractionDigits:0
    }).format(angka);

}

document.getElementById('pinjaman').addEventListener('keyup', function(){

    let angka = this.value.replace(/[^,\d]/g, '').toString();

    let split = angka.split(',');

    let sisa = split[0].length % 3;

    let rupiah = split[0].substr(0, sisa);

    let ribuan = split[0].substr(sisa).match(/\d{3}/gi);

    if(ribuan){

        let separator = sisa ? '.' : '';

        rupiah += separator + ribuan.join('.');

    }

    this.value = rupiah;

});

function hitungSimulasi(){

    let jenis = document.getElementById('jenis').value;

    let pinjaman = parseInt(
        document.getElementById('pinjaman').value.replace(/\./g,'')
    );

    let tenor = parseInt(
        document.getElementById('tenor').value
    );

    let bunga = 0;

    let maksimalTenor = 0;

    let valid = true;

    let pesan = '';

    if(!pinjaman || pinjaman < 1000000){

        alert('Minimal pinjaman Rp 1.000.000');

        return;

    }

    if(!tenor){

        alert('Lama pinjaman wajib diisi');

        return;

    }

    // KREDIT UMUM
    if(jenis == 'umum'){

        if(pinjaman >= 1000000 && pinjaman <= 25000000){

            bunga = 18;
            maksimalTenor = 60;

        }

        else if(pinjaman > 25000000 && pinjaman <= 100000000){

            bunga = 15;
            maksimalTenor = 60;

        }

        else if(pinjaman > 100000000){

            bunga = 13;
            maksimalTenor = 120;

        }

    }

    // KREDIT UMKM
    else if(jenis == 'umkm'){

        if(pinjaman <= 50000000){

            bunga = 9;
            maksimalTenor = 24;

        }

        else{

            valid = false;

            pesan =
                'Kredit UMKM maksimal pinjaman Rp 50.000.000';

        }

    }

    // KREDIT ASN
    else if(jenis == 'asn'){

        if(pinjaman >= 1000000 && pinjaman <= 25000000){

            bunga = 15;
            maksimalTenor = 60;

        }

        else if(pinjaman > 25000000 && pinjaman <= 50000000){

            bunga = 14;
            maksimalTenor = 120;

        }

        else if(pinjaman > 50000000 && pinjaman <= 100000000){

            bunga = 13;
            maksimalTenor = 120;

        }

        else if(pinjaman > 100000000){

            bunga = 12;
            maksimalTenor = 120;

        }

        if(tenor < 12){

            valid = false;

            pesan =
                'Minimal tenor Kredit ASN adalah 12 bulan';

        }

    }

    // KREDIT PPPK
    else if(jenis == 'pppk'){

        if(pinjaman >= 1000000 && pinjaman <= 50000000){

            bunga = 10;
            maksimalTenor = 60;

        }

        else if(pinjaman > 50000000){

            bunga = 9;
            maksimalTenor = 60;

        }

    }

    // VALIDASI TENOR
    if(tenor > maksimalTenor){

        valid = false;

        pesan =
            'Maksimal tenor untuk pinjaman ini adalah ' +
            maksimalTenor +
            ' bulan';

    }

    if(!valid){

        alert(pesan);

        return;

    }

    // PERHITUNGAN
    let totalBunga =
        pinjaman * (bunga / 100) * (tenor / 12);

    let totalPinjaman =
        pinjaman + totalBunga;

    let angsuran =
        totalPinjaman / tenor;

    document.getElementById('hasil').style.display = 'block';

    document.getElementById('bunga').innerHTML =
        bunga + '% / tahun';

    document.getElementById('angsuran').innerHTML =
        rupiah(angsuran);

    document.getElementById('note').innerHTML =
        '*Simulasi ini hanya estimasi dan dapat berubah sesuai ketentuan BPR Tugu Artha Sejahtera';

}

function resetForm(){

    document.getElementById('jenis').selectedIndex = 0;

    document.getElementById('pinjaman').value = '';

    document.getElementById('tenor').value = '';

    document.getElementById('hasil').style.display = 'none';

}

</script>

</body>
</html>
